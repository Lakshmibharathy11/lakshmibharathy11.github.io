<footer>
  <div class="wrap foot">
    <span>© {{ site.time | date: '%Y' }} Lakshmi Bharathy Kumar · San Jose, CA</span>
    <span><a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a> · <a href="#main">Back to top ↑</a></span>
  </div>
</footer>
<script>
(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  try { var saved = localStorage.getItem('theme'); if (saved) root.setAttribute('data-theme', saved); } catch(e){}
  btn.addEventListener('click', function(){
    var current = root.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e){}
  });
  var menuBtn = document.getElementById('menuBtn'), links = document.getElementById('navLinks');
  menuBtn.addEventListener('click', function(){
    var open = links.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', open);
  });
  var nav = document.getElementById('nav');
  window.addEventListener('scroll', function(){ nav.classList.toggle('scrolled', window.scrollY > 10); }, {passive:true});
  // Tag filter on the blog index
  var bar = document.getElementById('tagBar');
  if (bar) {
    bar.addEventListener('click', function(e){
      var b = e.target.closest('button[data-tag]'); if (!b) return;
      var tag = b.getAttribute('data-tag');
      bar.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      document.querySelectorAll('.post-item').forEach(function(p){
        var tags = (p.getAttribute('data-tags') || '').split('|');
        p.hidden = tag !== 'all' && tags.indexOf(tag) === -1;
      });
    });
  }
})();
</script>
